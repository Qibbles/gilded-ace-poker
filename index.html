let SAMPLE=null, claudeOff=false;
(async()=>{ try{ SAMPLE = window.claude && window.claude.use ? await window.claude.use('sample') : null; }catch(e){ SAMPLE=null; }
  if(SAMPLE){ $('#askForm').hidden=false; log('Claude is at the table too. It will comment on your play as you go (change this in Table settings). The first time, Claude asks you to allow it.','sys'); } })();
const TOOLKIT=`The student's table toolkit (the methods you must teach with): 1) Starting-hand chart with Tiers 1-5 (Premium, Strong, Good, Playable, Weak); open-raise Tiers 1-4 heads-up, 1-3 from late seats in bigger games, 1-2 from early seats; facing a raise, 3-bet Tier 1 and call the next tier or two. 2) Hand-strength ladder after the flop: Monster (two pair or better using your cards) raise; Strong (overpair, top pair good kicker) bet or call; Medium (top pair weak kicker, middle pair, under-pair) check, call one small bet heads-up; Weak/Nothing fold to bets unless the draw pays. 3) Price = call ÷ (pot + call). 4) Outs × 2 for one card, × 4 for two cards. 5) Bluff break-even = bet ÷ (pot + bet). 6) Sizes: open 3 big blinds, 3-bet 3× their raise, value bets ½-⅔ pot.`;
const PLAYER_CONTEXT=`The student is a beginner at Level 2 of 6 ("Betting": bet sizes, value bets, pot odds). Known leaks from past coaching: unclear bet wording (should say "raise to $X"), bets too small (aim for half to two-thirds pot), not re-raising strong hands, forgetting to add the call to the pot when working out pot odds, calling with weak hands because the price "looks cheap". Strengths: disciplined folds, value bets when ahead.`;
function spotText(){
  const me=G.players[0];
  const lines=[`No-Limit Texas Hold'em cash game, blinds $1/$2, ${G.players.length} players.`];
  lines.push('Players: '+G.players.map((p,k)=>`${p.human?'Student (You)':p.name}${P.STYLES[p.style]?' ['+P.STYLES[p.style].label+']':''} at ${G.posLabel(k)||'?'}, stack $${p.stack}${p.folded?' (folded)':''}`).join('; ')+'.');
  lines.push(`Student's cards: ${me.cards.map(cTxt).join(' ')}.`);
  if(G.board.length) lines.push(`Board: ${G.board.map(cTxt).join(' ')}.`);
  const st=['Preflop','Flop','Turn','River'];
  let last=-1, acts=[];
  for(const e of G.history){ if(e.street!==last){ acts.push(`\n${st[e.street]} (pot $${e.potBefore}):`); last=e.street; } acts.push(` ${e.name==='You'?'Student':e.name}: ${e.label};`); }
  lines.push('Action so far:'+acts.join(''));
  if(G.state==='done' && G.result){ lines.push('Result: '+resultLine().replace(/<[^>]+>/g,'')); if(G.result.hands) lines.push('Shown: '+G.result.hands.map(h=>`${G.players[h.i].name}: ${G.players[h.i].cards.map(cTxt).join(' ')} (${h.desc})`).join('; ')); }
  return lines.join('\n');
}
function claudeMsg(){ const el=document.createElement('div'); el.className='msg claude wait'; el.innerHTML='<span class="who">Claude</span><span class="body">Thinking…</span>'; const L=$('#log'); L.appendChild(el); L.scrollTop=L.scrollHeight; return el; }
async function askClaude(prompt,opts={}){
  if(!SAMPLE || claudeOff) return;
  const el=claudeMsg(), body=el.querySelector('.body'), L=$('#log');
  try{
    await SAMPLE(prompt,{modelTier:opts.tier||'quick',cache:false,onText:({text})=>{ el.classList.remove('wait'); body.textContent=text; const near=L.scrollHeight-L.scrollTop-L.clientHeight<80; if(near) L.scrollTop=L.scrollHeight; }});
  }catch(e){
    el.classList.remove('wait');
    if(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='not_declared'||e.code==='capability_disabled'){ claudeOff=true; $('#askForm').hidden=true; body.textContent='Claude isn\'t allowed on this page right now, so only the built-in coach will comment. You can allow it from the page\'s Permissions menu.'; }
    else if(e.code==='rate_limited'){ body.textContent=(e.text||'')+'\n(Claude is getting too many requests. Its comments will resume shortly; the built-in coach keeps going.)'; }
    else if(e.code==='cancelled'){ el.remove(); }
    else body.textContent=(e.text||'')+(e.text?'\n(cut off)':'Claude couldn\'t answer just now.');
  }
}
function claudeDecision(a,j,ev){
  const facts=`Table-math facts at the decision: ${a.street===0?`starting hand ${a.label}, chart Tier ${a.tier} of 5 (${P.TIERS[a.tier].n}); chart rule from this seat: open-raise Tiers 1-${a.openTier}.`:`hand ladder: ${P.LADDER[a.ladder.lv]} (${a.ladder.why}).`} ${a.priceTxt||'No bet to call.'} ${a.outsTxt||'No useful outs.'} Simulator check (for you only, not a teaching tool): about ${pc(a.eq)}% to win. Rule-based coach graded it "${j.grade}": ${j.text}`;
  askClaude(`You are a warm, sharp poker coach sitting beside a student during a live practice hand. ${PLAYER_CONTEXT}\n\n${TOOLKIT}\n\n${spotText()}\n\nThe student just chose: ${ev.label}.\n${facts}\n\nGive immediate feedback on THIS decision in 2-3 short sentences: was it right, and the one reason that matters most. Explain it with the toolkit rules the student can use at a real table (chart tier, ladder level, price formula, outs × 2/× 4, bluff break-even), showing the actual arithmetic. Do not lead with the simulator percentage; mention it only if the rules give the wrong answer here, and then name the rule's exception. If you disagree with the rule-based grade, say so and why. Plain words; explain any poker term in brackets. If it ties to a known leak, mention it briefly. No headings, no lists, no preamble.`);
}
function claudeHand(){
  askClaude(`You are a warm, sharp poker coach reviewing a practice hand the student just finished. ${PLAYER_CONTEXT}\n\n${spotText()}\n\nBuilt-in coach grades of the student's decisions: ${handFb.map(x=>x.grade+': '+x.text).join(' | ')}\n\nReview the hand in 4-6 short sentences: what the student did well, the single most important lesson, and the key number (pot odds or outs) if relevant, showing the arithmetic. Plain words; explain any jargon in brackets. No headings or lists.`,{tier:'default'});
}
$('#askForm').addEventListener('submit',e=>{
  e.preventDefault(); const q=$('#askIn').value.trim(); if(!q) return; $('#askIn').value='';
  log(`<b>You asked:</b> ${q.replace(/</g,'&lt;')}`,'sys');
  const spot=G&&G.players[0].cards.length?spotText():'No hand in progress.';
  const live=cur?`\nIt is the student's turn now. Legal: ${cur.L.canCheck?'check':'fold, call $'+cur.toCall}${cur.L.canRaise?', '+(cur.L.isBet?'bet':'raise to')+' $'+cur.L.minTo+'-$'+cur.L.maxTo:''}. Engine estimate: win chance ${pc(cur.eq)}%, price ${pc(cur.potOdds)}%, outs ${cur.outs?cur.outs.count:'n/a'}.`:'';
  askClaude(`You are a warm, sharp poker coach at a practice table. ${PLAYER_CONTEXT}\n\nCurrent table:\n${spot}${live}\n\nThe student asks: "${q}"\n\nAnswer directly and briefly (under 120 words), using the hand as the example. Plain words; explain any jargon in brackets. If they're asking what to do now, coach them to the decision and show the math.`,{tier:'default'});
});

 {grp:'The math', t:'Equity and the rule of 2 and 4', k:'Fast math at the table', h:()=>`

 {grp:'Strategy', t:'Reading opponents', k:'Styles and ranges', h:()=>`

  <p>On the practice table, turn off "Show opponent styles" once you can name each style after a few hands.</p>`},
 {grp:'Strategy', t:'How winners win', k:'Bankroll, tilt and patience', h:()=>`
  <p>Nobody wins every session. Winning players get small edges again and again, and avoid big leaks.</p>
  <ul><li><b>Fold more preflop.</b> Most losing players play too many hands.</li>
  <li><b>Bet your good hands.</b> Value betting earns more than bluffing.</li>
  <li><b>Respect the price.</b> Don't call because a bet "looks cheap"; do the math.</li>
  <li><b>Play in position.</b> Play more hands on the button, fewer up front.</li>
  <li><b>Watch for ${term('tilt')}.</b> After a painful loss, take a break.</li>
  <li><b>Bankroll.</b> For real-money cash games, keep 20 to 40 buy-ins for your stake, so a bad run doesn't knock you out.</li></ul>`},
 {grp:'Other games', t:'Other poker games', k:'What changes, what carries over', h:()=>`
  <p>The practice table plays No-Limit Texas Hold'em, the most common game. Position, pot odds, outs and value betting carry over to everything below.</p>
  <div class="tbl"><table><tr><th>Game</th><th>How it differs</th><th>Key tip</th></tr>
   <tr><td><b>Pot-Limit Omaha (PLO)</b></td><td>Four private cards. You must use <i>exactly two</i> of them plus three from the board. Max bet is the pot size.</td><td>Hands run much closer. Draw to the nuts; a plain flush often loses.</td></tr>
   <tr><td><b>Omaha Hi-Lo</b></td><td>Pot splits between the best high hand and the best low (five cards 8 or lower).</td><td>Play hands that can win both halves, like A-2 with suited cards.</td></tr>
   <tr><td><b>Short Deck (6+)</b></td><td>2s to 5s removed. A flush beats a full house; A-6-7-8-9 is a straight.</td><td>Draws hit more often; outs math changes (36-card deck).</td></tr>
   <tr><td><b>Seven-Card Stud</b></td><td>No shared cards. Each player gets 7 cards (some face up), with five betting rounds.</td><td>Track the visible cards: dead cards reduce your outs.</td></tr>
   <tr><td><b>Razz</b></td><td>Stud where the lowest hand wins. Straights and flushes don't count; A is low.</td><td>Start with three cards 8 or lower.</td></tr>
   <tr><td><b>Five-Card Draw</b></td><td>Five private cards, one chance to swap some, then bet.</td><td>How many cards someone draws tells you a lot.</td></tr>
   <tr><td><b>2-7 Triple Draw</b></td><td>Lowball with three draws. Aces are high and straights/flushes count against you; 7-5-4-3-2 is best.</td><td>Count outs to a smooth low.</td></tr>
   <tr><td><b>Tournaments</b></td><td>Fixed buy-in, blinds rise over time, last player standing wins.</td><td>Survival matters near the prize places, so play tighter there (the idea behind ICM).</td></tr></table></div>`},
 {grp:'Reference', t:'Your table toolkit', k:'Every rule on one page', h:()=>`
  <p>These are the rules the coach uses to grade you. Every one works at a real table with mental math only.</p>
  <h3>1 · Before the flop: the chart</h3>
  <p>Know your hand's tier (Lesson 4). Raise when nobody has raised and your tier is in range for your seat; otherwise fold. Never just call the big blind. Facing a raise: re-raise Tier 1, call the next tier or two, fold the rest.</p>
  <h3>2 · After the flop: the hand-strength ladder</h3>
  <div class="tbl"><table><tr><th>Level</th><th>Examples</th><th>Nobody bet</th><th>Facing a bet</th></tr>
   <tr><td><b>Monster</b></td><td>Set, two pair with both cards, straight, flush</td><td>Bet ⅔ pot</td><td>Raise to 3×</td></tr>
   <tr><td><b>Strong</b></td><td>Overpair, top pair + J kicker or better</td><td>Bet ⅔ pot</td><td>Call</td></tr>
   <tr><td><b>Medium</b></td><td>Top pair weak kicker, middle pair, pocket pair under one card</td><td>Check</td><td>Call one bet of ½ pot or less, heads-up only</td></tr>
   <tr><td><b>Weak / Nothing</b></td><td>Bottom pair, board pair, no pair</td><td>Check (semi-bluff big draws)</td><td>Fold, unless the draw pays (rule 3)</td></tr></table></div>
  <h3>3 · Does my draw pay?</h3>
  <p class="formula">Price = call ÷ (pot + call) &nbsp;vs&nbsp; outs × 2</p>
  <p>Call if outs × 2 is at least the price. On the flop with deep stacks you can stretch toward outs × 4, because you may see two cards and win more later (${term('implied odds')}).</p>
  <h3>4 · Will my bluff work?</h3>
  <p class="formula">They must fold more than: bet ÷ (pot + bet)</p>
  <p>Half pot needs 33% folds, two-thirds pot needs 40%, pot needs 50%. Bluff one tight player; never bluff calling stations.</p>
  <h3>5 · Bet sizes</h3>
  <p>Open to 3 big blinds (+1 per limper). Re-raise to 3× their raise. Value bets and semi-bluffs: ½ to ⅔ pot.</p>
  <h3>Shortcuts to memorise</h3>

  <p class="note">Rules are simplifications. The coach's scroll has a "Simulator check" that shows when a rule misleads, so you learn the exceptions.</p>`},

function glossList(q){ q=q.toLowerCase(); return Object.entries(GL).filter(([k,v])=>!q||k.includes(q)||v.toLowerCase().includes(q)).sort().map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')||'<dd>No match.</dd>'; }
function startGrid(){
  const R=[14,13,12,11,10,9,8,7,6,5,4,3,2]; const L=r=>P.RN[r].replace('10','T');
  let cells='';
  for(let i=0;i<13;i++) for(let j=0;j<13;j++){
    const a=R[i], b=R[j]; let key,lab;
    if(i===j){ key=a+'-'+b+'p'; lab=L(a)+L(b); } else if(j>i){ key=a+'-'+b+'s'; lab=L(a)+L(b)+'s'; } else { key=b+'-'+a+'o'; lab=L(b)+L(a)+'o'; }
    const p=P.PCT[key]; const t=p<=0.06?1:p<=0.15?2:p<=0.3?3:p<=0.5?4:5;
    cells+=`<button class="t${t}" data-k="${lab}" data-p="${p}" aria-label="${lab}, top ${Math.max(1,pc(p))}%">${lab.length>2&&innerWidth<500?lab.slice(0,2):lab}</button>`;
  }
  return `<p>Every two-card start fits one square. Pairs run down the diagonal; ${term('suited')} hands (marked s) are above it, ${term('offsuit')} hands (marked o) below. Tap a square.</p>
  <div class="legend"><span><i class="t1"></i>Tier 1 Premium</span><span><i class="t2"></i>Tier 2 Strong</span><span><i class="t3"></i>Tier 3 Good</span><span><i class="t4"></i>Tier 4 Playable</span><span><i class="t5" style="border:1px solid #b9ab8b"></i>Tier 5 Weak</span></div>
  <div class="grid13" id="g13">${cells}</div><p id="g13i" class="note" style="min-height:1.4em;margin-top:8px">Tap a hand to see how it ranks.</p>
  <h3>The chart rules (what the coach grades you on)</h3>
  <div class="tbl"><table><tr><th>Spot</th><th>Raise</th><th>Call</th></tr>
  <tr><td>Nobody has raised, heads-up</td><td>Tiers 1-4</td><td>Never limp</td></tr>
  <tr><td>Nobody has raised, 3 players</td><td>Button: Tiers 1-4 · others: 1-3</td><td>Never limp</td></tr>
  <tr><td>Nobody has raised, 4+ players</td><td>Button, cutoff, hijack, small blind: Tiers 1-3 · early seats: 1-2</td><td>Never limp</td></tr>
  <tr><td>Someone raised, heads-up</td><td>Tier 1 (re-raise to 3×)</td><td>Tiers 2-3 (big blind: 2-4)</td></tr>
  <tr><td>Someone raised, 3+ players</td><td>Tier 1 (re-raise to 3×)</td><td>Tier 2 (big blind: 2-3)</td></tr></table></div>
  <p>To learn the tiers fast: <b>Tier 1</b> is pairs 9-9 and up, A-K, and A-Q suited. <b>Tier 2</b> adds 7-7 and 8-8, A-Q, A-J and K-Q, suited aces, and suited connectors like 9-8 suited. <b>Tier 3</b> adds the small pairs and unsuited connectors like J-10. <b>Tier 4</b> is most other hands with an ace, or a king with a 9 or better. <b>Tier 5</b> is the rest, like K-5 or 7-2.</p>
  <p class="note">Rankings use the Chen formula, a simple scoring system for starting hands. Real solvers differ a little, but it's a reliable guide.</p>`;
}

const D={};
function dScore(){ return `<span class="note">Right ${stats.drillR} of ${stats.drillT}</span>`; }
function drillWin(){
  const d=P.shuffle(P.newDeck()); const A=[d.pop(),d.pop()], B=[d.pop(),d.pop()], bd=[d.pop(),d.pop(),d.pop(),d.pop(),d.pop()];
  const sa=P.evalHand([...A,...bd]), sb=P.evalHand([...B,...bd]); D.win={ans: sa>sb?'A':sb>sa?'B':'S', sa, sb};
  $('#dWin').innerHTML=`<div class="lbl">Drill 1</div><h2>Which hand wins?</h2>
   <div class="drill-cards"><div class="grp"><span class="lbl">Board</span><div class="row">${bd.map(c=>cardH(c)).join('')}</div></div></div>
   <div class="drill-cards"><div class="grp"><span class="lbl">Player A</span><div class="row">${A.map(c=>cardH(c)).join('')}</div></div><div class="grp"><span class="lbl">Player B</span><div class="row">${B.map(c=>cardH(c)).join('')}</div></div></div>
   <div class="next" style="margin-top:6px"><button class="btnx" data-a="A">A wins</button><button class="btnx" data-a="B">B wins</button><button class="btnx" data-a="S">Split pot</button></div>
   <div class="feedback" id="dWinF"></div><div class="next"><button class="btnx sm ghost" id="dWinN">New deal</button>${dScore()}</div>`;
  $$('#dWin [data-a]').forEach(b=>b.onclick=()=>{ if(D.win.done) return; D.win.done=true; const ok=b.dataset.a===D.win.ans; stats.drillT++; if(ok) stats.drillR++; saveAll();
    const f=$('#dWinF'); f.className='feedback '+(ok?'good':'bad');
    f.innerHTML=`${ok?'Right.':'Not quite.'} A: ${P.describe(D.win.sa)}. B: ${P.describe(D.win.sb)}. ${D.win.ans==='S'?'Same five cards play, so they split.':''}`; });
  $('#dWinN').onclick=drillWin;
}
function drillOuts(){
  let hole,board,o,tries=0;
  do{ const d=P.shuffle(P.newDeck()); hole=[d.pop(),d.pop()]; board=[d.pop(),d.pop(),d.pop()]; o=P.outs(hole,board); tries++; }
  while(tries<400 && !(o.count>=4 && o.count<=15 && P.catOf(P.evalHand([...hole,...board]))<=1 && P.draws(hole,board).length));
  D.outs={hole,board,o};
  $('#dOuts').innerHTML=`<div class="lbl">Drill 2</div><h2>Count your outs</h2>
   <div class="drill-cards"><div class="grp"><span class="lbl">Your hand</span><div class="row">${hole.map(c=>cardH(c)).join('')}</div></div><div class="grp"><span class="lbl">Flop</span><div class="row">${board.map(c=>cardH(c)).join('')}</div></div></div>
   <p class="note">Count cards that improve your hand class (pair → two pair counts, draws completing count). Then % to hit on the turn.</p>
   <div class="quiz"><div class="qrow"><label for="doO">Outs</label><input id="doO" inputmode="numeric"></div><div class="qrow"><label for="doH">% on the turn</label><input id="doH" inputmode="decimal"></div><button class="btnx sm primary" id="doGo">Check</button></div>
   <div class="feedback" id="dOutsF"></div><div class="next"><button class="btnx sm ghost" id="dOutsN">New flop</button>${dScore()}</div>`;
  $('#doGo').onclick=()=>{ const {o}=D.outs; const ao=parseFloat($('#doO').value), ah=parseFloat($('#doH').value); const hit=o.count/47*100;
    const ok1=Math.abs(ao-o.count)<=1, ok2=Math.abs(ah-hit)<=3; stats.drillT+=2; stats.drillR+=(ok1?1:0)+(ok2?1:0); saveAll();
    const groups={}; o.cards.forEach(x=>{ (groups[x.cat]=groups[x.cat]||[]).push(cTxt(x.c)); });
    const f=$('#dOutsF'); f.className='feedback '+(ok1&&ok2?'good':'bad');
    f.innerHTML=`${ok1?'✔':'✘'} ${o.count} outs: ${Object.entries(groups).sort((a,b)=>b[0]-a[0]).map(([c,l])=>`${l.length} for ${P.CATS[c].toLowerCase()} (${l.join(' ')})`).join('; ')}.<br>${ok2?'✔':'✘'} ${o.count} ÷ 47 = ${Math.round(hit)}%. Rule of 2: ${o.count*2}%.`; };
  $('#dOutsN').onclick=drillOuts;
}
function drillOdds(){
  const bet=[4,6,8,10,12,15,20,25,30,40,50][Math.floor(Math.random()*11)];
  const before=Math.max(4,Math.round(bet*[1,1.5,2,3,0.75][Math.floor(Math.random()*5)]));
  const pot=before+bet; const ans=bet/(pot+bet)*100; D.odds={pot,bet,ans};
  $('#dOdds').innerHTML=`<div class="lbl">Drill 3</div><h2>What's the price?</h2>
   <p>The pot shows <b>$${pot}</b> after your opponent bets <b>$${bet}</b>. You must call <b>$${bet}</b>.</p>
   <p class="note">Price = call ÷ (pot + call). Remember to add your call.</p>
   <div class="quiz"><div class="qrow"><label for="dpP">Price, %</label><input id="dpP" inputmode="decimal"></div><button class="btnx sm primary" id="dpGo">Check</button></div>
   <div class="feedback" id="dOddsF"></div><div class="next"><button class="btnx sm ghost" id="dOddsN">New spot</button>${dScore()}</div>`;
  $('#dpGo').onclick=()=>{ const v=parseFloat($('#dpP').value); const ok=Math.abs(v-ans)<=2; stats.drillT++; if(ok) stats.drillR++; saveAll();
    const f=$('#dOddsF'); f.className='feedback '+(ok?'good':'bad');
    f.innerHTML=`${ok?'✔ Right.':'✘ Not quite.'} $${bet} ÷ ($${pot} + $${bet}) = ${bet} ÷ ${pot+bet} = ${ans.toFixed(1)}%. Call if you win more often than that.`; };
  $('#dOddsN').onclick=drillOdds;
}

function drillLadder(){
  let hole,board,tries=0;
  do{ const d=P.shuffle(P.newDeck()); hole=[d.pop(),d.pop()]; board=[d.pop(),d.pop(),d.pop()]; tries++; } while(tries<50 && P.ladder(hole,board).lv===0 && Math.random()<0.7);
  const ld=P.ladder(hole,board); D.lad={ld};
  $('#dLadder').innerHTML=`<div class="lbl">Drill 4</div><h2>Where on the ladder?</h2>
   <div class="drill-cards"><div class="grp"><span class="lbl">Your hand</span><div class="row">${hole.map(c=>cardH(c)).join('')}</div></div><div class="grp"><span class="lbl">Flop</span><div class="row">${board.map(c=>cardH(c)).join('')}</div></div></div>
   <div class="next" style="margin-top:6px">${['Monster','Strong','Medium','Weak','Nothing'].map(x=>`<button class="btnx" data-l="${x}">${x}</button>`).join('')}</div>
   <div class="feedback" id="dLadF"></div><div class="next"><button class="btnx sm ghost" id="dLadN">New flop</button>${dScore()}</div>`;
  $$('#dLadder [data-l]').forEach(b=>b.onclick=()=>{ if(D.lad.done) return; D.lad.done=true; const right=P.LADDER[D.lad.ld.lv]; const ok=b.dataset.l===right; stats.drillT++; if(ok) stats.drillR++; saveAll();
    const act={Monster:'raise a bet, bet ⅔ pot when checked to',Strong:'bet ⅔ pot, call a bet',Medium:'check, call one small bet heads-up',Weak:'check, fold to a bet unless a draw pays',Nothing:'check, fold to a bet unless a draw pays'}[right];
    const f=$('#dLadF'); f.className='feedback '+(ok?'good':'bad'); f.innerHTML=`${ok?'Right':'Not quite'}: <b>${right}</b>, ${D.lad.ld.why}. Plan: ${act}.`; });
  $('#dLadN').onclick=drillLadder;
}

   ${wins.map(([k,v])=>`<div class="leakrow"><div>${GOOD[k]}<div class="bar g"><i style="width:${v/maxW*100}%"></i></div></div><b>${v}×</b></div>`).join('')||'<p class="note">Good decisions will show up here.</p>'}
   <div class="next"><button class="btnx sm danger" id="pReset">Reset progress</button></div><div id="pResetC"></div></div>`;
  const useRec=()=>{ settings.opp=LEVELS[stats.level].opp; settings.diff=LEVELS[stats.level].diff; saveAll(); applySettingsUI(); location.hash='#table'; newTable(); };
  $('#pUse').onclick=useRec;
  $('#pUp')&&($('#pUp').onclick=()=>{ stats.level++; stats.levelDecisions=0; stats.levelMistakes=0; saveAll(); renderProgress(); });
  $('#pDown')&&($('#pDown').onclick=()=>{ stats.level--; stats.levelDecisions=0; stats.levelMistakes=0; saveAll(); renderProgress(); });
  $('#pReset').onclick=()=>{ $('#pResetC').innerHTML=`<p class="note">This clears all stats on this device.</p><button class="btnx sm danger" id="pResetY">Yes, reset</button>`; $('#pResetY').onclick=()=>{ stats={hands:0,net:0,good:0,ok:0,mistake:0,leaks:{},wins:{},quizR:0,quizT:0,drillR:0,drillT:0,sessions:[],level:2,levelDecisions:0,levelMistakes:0}; session=freshSession(); saveAll(); renderProgress(); }; };
}

/* =================== boot =================== */
lessonIdx=Math.min(LESSONS.length-1,store.get('lesson',0)||0);
renderLesson(); drillWin(); drillOuts(); drillOdds(); drillLadder();
applySettingsUI();
addEventListener('resize',()=>{ if(!$('#v-table').hidden) render(); });
log('Welcome to the Gilded Ace. Tap any <span class="term" data-t="pot odds" tabindex="0">dotted word</span> to see what it means.','sys');
newTable();
route();
</script>
